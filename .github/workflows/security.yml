name: Security

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:

  # ==========================================
  # SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # BACKEND DEPENDENCY SCAN
  # ==========================================
  backend-dependencies:
    name: Backend Dependency Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high


  # ==========================================
  # FRONTEND DEPENDENCY SCAN
  # ==========================================
  frontend-dependencies:
    name: Frontend Dependency Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high


  # ==========================================
  # FILESYSTEM SCAN
  # ==========================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


  # ==========================================
  # DOCKER SECURITY SCAN
  # ==========================================
  docker-security:
    name: Docker Image Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: hostel-finder-backend:security

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hostel-finder-backend:security
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: hostel-finder-frontend:security

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hostel-finder-frontend:security
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
